[platformio]
src_dir = programs
default_envs = balance-xiao_c3

# Abstract board sections (not real envs).
[board_uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

# Arduino UNO R4 WiFi (Renesas RA4M1, native USB serial; uploads over its USB port). Not the same as the Uno R3 (ATmega328P).
[board_uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

# ATtiny85: no hardware UART/serial monitor; uploads via ISP programmer (change upload_protocol to match yours, e.g. arduinoisp, stk500v1); 8KB flash, 512B RAM
[board_attiny85]
platform = atmelavr
board = attiny85
framework = arduino
board_build.f_cpu = 8000000L
upload_protocol = usbasp

# Native USB Serial on Seeed Studio XIAO ESP32-S3:The XIAO ESP32-S3 uses the native USB peripheral on the ESP32-S3 rather than a separate USB-to-UART bridge. To see serial output over monitor_speed = 115200, you typically need USB CDC on boot enabled:
[board_xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

# Seeed Studio XIAO ESP32-C3 (RISC-V, native USB Serial/JTAG). CDC on boot keeps Serial off GPIO20/21, which tilt_servo uses for Serial1 (servo bus).
[board_xiao_c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[board_esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17

# add new board here
# [board_<new>]
# platform = <platform>
# board = <board>
# framework = arduino
# monitor_speed = 115200

# To add program: mkdir programs/<name>, add main.cpp, add env per supported board.
# To add board: add [board_x] section, then envs.
# balance is not built for uno, uno_r4_wifi or attiny85 (no IMU/RAM support).
# Target: XIAO ESP32-C3 only (balance-xiao_c3*). The older S3 and generic ESP32 balance envs were retired (#46); the ESP32-S3 is a future enhancement.

[balance_c3_common]
lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.9
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    robotis-git/Dynamixel2Arduino @ 0.8.1

# Target env for balance: LQR controller (default).
[env:balance-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<balance/>
build_flags =
    ${board_xiao_c3.build_flags}
    -D BALANCE_CONTROLLER_LQR
lib_deps = ${balance_c3_common.lib_deps}

# PID variant of the C3 balance firmware.
[env:balance-xiao_c3-pid]
extends = board_xiao_c3
build_src_filter = -<*> +<balance/>
build_flags =
    ${board_xiao_c3.build_flags}
    -D BALANCE_CONTROLLER_PID
lib_deps = ${balance_c3_common.lib_deps}

[env:blink-uno]
extends = board_uno
build_src_filter = -<*> +<blink/>

[env:blink-uno_r4_wifi]
extends = board_uno_r4_wifi
build_src_filter = -<*> +<blink/>

[env:blink-attiny85]
extends = board_attiny85
build_src_filter = -<*> +<blink/>

[env:blink-xiao_s3]
extends = board_xiao_s3
build_src_filter = -<*> +<blink/>

[env:blink-esp32dev]
extends = board_esp32dev
build_src_filter = -<*> +<blink/>

[env:blink-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<blink/>

[env:tilt_servo-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<tilt_servo/>
lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.9
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit SSD1306 @ 2.5.17
    robotis-git/Dynamixel2Arduino @ 0.8.1

# #43 probe: times IMU read, servo bus, controller step, heap and loop period on the real C3.
# Torque stays OFF unless built with -D C3PROBE_TORQUE_ON (set via PLATFORMIO_BUILD_FLAGS, human opt-in).
[env:c3_probe-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<c3_probe/>
lib_deps = ${balance_c3_common.lib_deps}

# #44 probe: IMU facts, servo facts and an opt-in capped velocity ramp (bench tool, servo OFF the robot).
# The ramp exists only with -D C3FACTS_RAMP (PLATFORMIO_BUILD_FLAGS, human opt-in) and still needs a typed GO.
[env:c3_facts-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<c3_facts/>
lib_deps = ${balance_c3_common.lib_deps}

[env:ttl_servo-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<ttl_servo/>
lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.9
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    madhephaestus/ESP32Servo @ ^3.0.0

[env:stepper_motor-xiao_c3]
extends = board_xiao_c3
build_src_filter = -<*> +<stepper_motor/>
lib_deps =
    adafruit/Adafruit MPU6050 @ 2.2.9
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4

# Test environment
[env:test]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -ffp-contract=off
