# Headless gyro Z disturbance for the c3_ctrl_wheel sim (SIM-ONLY, not hardware-validated).
# Applied AFTER the boot gyro calibration, so it is not absorbed as bias.
# Path is relative to the project dir (programs/c3_ctrl_wheel). Run: make sim-c3_ctrl_wheel-xiao_c3 WOKWI_ARGS="--scenario scenario_ctrl_wheel.yaml --timeout 20000"
# wait-serial matches the banner printed in programs/c3_ctrl_wheel/main.cpp setup(); change both together.
# rotationZ is in deg/s (30 deg/s = 0.524 rad/s). Steps total ~12 s after the banner; the run does not
# end by itself, so --timeout stops it (exit 42 is expected). 20000 ms leaves roughly 7 s margin for boot.
name: c3_ctrl_wheel gyro Z push
version: 1
steps:
  - wait-serial: 'Sim starts at 15 deg'
  - delay: 4000ms
  - set-control:
      part-id: imu
      control: rotationZ
      value: 30
  - delay: 4000ms
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0
  - delay: 4000ms
