[wokwi]
version = 1
firmware = '../../.pio/build/c3_ctrl_wheels-xiao_c3/firmware.bin'
elf = '../../.pio/build/c3_ctrl_wheels-xiao_c3/firmware.elf'
# RFC2217 TCP server for the simulated serial port. Port 4002 here; 4000 is ttl_servo's and 4001 is c3_ctrl_wheel's. Running all three at once was not tried.
rfc2217ServerPort = 4002

[[chip]]
name = 'wokwi-fe-urt-1'
binary = '../../wokwi/chips/wokwi-fe-urt-1.chip.wasm'

[[chip]]
name = 'wokwi-ttl-servo'
binary = '../../wokwi/chips/wokwi-ttl-servo.chip.wasm'
