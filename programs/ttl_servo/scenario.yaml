# Headless gyro Z disturbance for the ttl_servo sim (SIM-ONLY, not hardware-validated).
# Applied AFTER the boot gyro calibration, so it is not absorbed as bias.
# Path is relative to the project dir (programs/ttl_servo). Run: make sim-ttl_servo-xiao_c3 WOKWI_ARGS="--scenario scenario.yaml --timeout 20000"
name: ttl_servo gyro Z push
version: 1
steps:
  - wait-serial: 'Sim starts at 15 deg'
  - delay: 4000ms
  - set-control:
      part-id: imu
      control: rotationZ
      value: 30
  - delay: 4000ms
  - set-control:
      part-id: imu
      control: rotationZ
      value: 0
  - delay: 4000ms
