# SIM-ONLY disposable POC for #148 (kill pushbutton). Delete with the POC (#151). Not hardware-validated.
# Run (path relative to programs/ttl_servo): PLATFORMIO_BUILD_FLAGS="-D TTL_SERVO_KILL_POC" make sim-ttl_servo-xiao_c3 WOKWI_ARGS="--scenario scenario_kill.yaml --timeout 20000"
# Exit 42 (timeout) is expected: the run does not end by itself.
# UNVERIFIED: the pushbutton control name `pressed` and the diagram pin names `1.l` / `2.l` are not checked against the Wokwi part.
# wait-serial matches the banner printed in programs/ttl_servo/main.cpp setup(); change both together.
name: ttl_servo kill pushbutton
version: 1
steps:
  - wait-serial: 'Sim starts at 15 deg'
  - delay: 4000ms
  - set-control:
      part-id: kill_btn
      control: pressed
      value: 1
  - delay: 200ms
  - set-control:
      part-id: kill_btn
      control: pressed
      value: 0
  - delay: 2000ms
